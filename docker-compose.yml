services:
  backend:
    build:
      context: ./backend
    container_name: analizadorseguridadqr-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data
      - ./backend/scripts:/app/scripts
    restart: unless-stopped
